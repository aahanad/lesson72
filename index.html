<!DOCTYPE html>
<html lang="en" data-theme="fall">
    <head>
        <link rel="stylesheet" href="style.css">
        <title>The Bakeshop🧁</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Modak&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Bakeshop is the perfect website for you to find your new favorite sweet treats!">
<script src="script.js"defer></script>
    </head>
    <body>
        <div class="background-blobs">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>

        </div>
        <nav class="navbar">
        <div class="logo">
            <img src="logo.png" alt="The Bakeshop Logo">


        </div>   
        <div class="nav-links">
            <button id="featured">Featured</button>
            <button id="seasonal">Seasonal</button>
            <button id="by-ingredient">By Ingredient</button>
            <button id="saved">Saved</button>
            <button id="baking-tips">Baking Tips</button>
            <button class="btn-primary"id="post-recipe">Post Recipe</button>
       
        <div class="theme_picker">
            <button class="theme-btn" id="color-changer" aria-haspopup="true" aria-expanded="false">🎨</button>
            <ul class="theme-menu"id ="theme-menu" hidden>
            <li><button data-theme="fall">🎃Fall</button> </li>   
            <li><button data-theme="winter">❄️Winter</button> </li>
            <li><button data-theme="spring">🌼Spring</button> </li>
            <li><button data-theme="summer">☀️Summer</button> </li>      

            </ul>

        </div>
        </div>
        </nav>
        <div class="explore-page" id="explore">
            <h1 id="search">Explore <span>Recipies</span></h1>
            <p>find the perfect recipe for any occasion</p>
            <div class="search-bar">
                <input id="search-input" type="text" placeholder="Search for a recipe">
                <button id="search-btn">🔍</button>
                
            
            </div>
            <div class="fiter-containers">
                <label>Category:</label>
                <select id="category-filter">
                    <option value="">All Categories</option>
                    <option value="cookies">Cookies</option>
                    <option value="bread">Breads</option>
                    <option value="cakes">Cakes</option>
                    <option value="ice-cream">Ice Cream</option>
                    <option value="pastries">Pastries</option>
                    <option value="confections/candy">Confections/Candy</option>


                </select>
                
                <label>Season:</label>
                <select id="season-filter">
                    <option value="fall">Fall</option>
                    <option value="winter">Winter</option>
                    <option value="spring">Spring</option>
                    <option value="summer">Summer</option>
                    

                </select>
                <div id="ingredientFilterContainer" class="hidden">
                 <label>Must include:</label>  
                 <input type="text" id="filterIngredient" placeholder="e.g.cinnamon">
                </div>
            </div>
            <section class="recipe-grid" id="recipeGrid"></section>

        </div>
    </body>
</html>
