<!DOCTYPE html>
<html lang="en" data-theme="fall">
    <head>
        <link rel="stylesheet" href="style.css">
        <title>The Bakeshop🧁</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Modak&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Bakeshop is the perfect website for you to find your new favorite sweet treats!">
<script src="script.js"defer></script>
    </head>
    <body>
        <div class="background-blobs">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>

        </div>
        <nav class="navbar">
        <div class="logo">
            <img src="logo.png" alt="The Bakeshop Logo">


        </div>   
        <div class="nav-links">
            <button id="featured">Featured</button>
            <button id="seasonal">Seasonal</button>
            <button id="by-ingredient">By Ingredient</button>
            <button id="saved">Saved</button>
            <button id="baking-tips">Baking Tips</button>
            <button class="btn-primary"id="post-recipe">Post Recipe</button>
       
        <div class="theme_picker">
            <button class="theme-btn" id="color-changer" aria-haspopup="true" aria-expanded="false">🎨</button>
            <ul class="theme-menu"id ="theme-menu" hidden>
            <li><button data-theme="fall">🎃Fall</button> </li>   
            <li><button data-theme="winter">❄️Winter</button> </li>
            <li><button data-theme="spring">🌼Spring</button> </li>
            <li><button data-theme="summer">☀️Summer</button> </li>      

            </ul>

        </div>
        </div>
        </nav>
        <div class="explore-page page-view active-view" id="explore">
            <h1 class="search">Explore <span>Recipies</span></h1>
            <p>find the perfect recipe for any occasion</p>
            <div class="search-bar">
                <input id="search-input" type="text" placeholder="Search for a recipe">
                <button id="search-btn">🔍</button>
                
            
            </div>
            <div class="filter-containers">
                <label>Category:</label>
                <select id="category-filter">
                    <option value="">All Categories</option>
                    <option value="cookies">Cookies</option>
                    <option value="bread">Breads</option>
                    <option value="cakes">Cakes</option>
                    <option value="ice-cream">Ice Cream</option>
                    <option value="pastries">Pastries</option>
                    <option value="confections/candy">Confections/Candy</option>


                </select>
                
                <label>Season:</label>
                <select id="season-filter">
                    <option value="fall">Fall</option>
                    <option value="winter">Winter</option>
                    <option value="spring">Spring</option>
                    <option value="summer">Summer</option>
                    

                </select>
                <div id="ingredientFilterContainer" class="hidden">
                 <label>Must include:</label>  
                 <input type="text" id="filterIngredient" placeholder="e.g.cinnamon">
                </div>
            </div>
            <section class="recipe-grid" id="recipeGrid">
                <!--recipes intjected here-->
            </section>

        </div>
        
        <!--saved recipies view-->
        <div id="viewSaved" class="page-view">
            <h1 class="search">My<span>Saved</span>Recipes</h1>
            <p>Your personal collection organized by category</p>
            <section id="savedCategoriesContainer">
            </section>
        </div>
        <!--Baking tips view-->
        <div id="viewTips" class="page-view">
            <div class="glass-panel" style="max-width: 800px; margin: 0 auto; padding: 3rem; border-radius: 24px;">
                <h2>Essential Baking Tips</h2>
                <ul style="line-height: 2;margin-top:1rem;">
                    <li>baking tip 1</li>

                </ul>
            </div>

        </div>
        
    <div id="viewUpload" class="page-view">
        <div class="upload-container glass-panel">
            <h2>Post a Recipe</h2>
            <form id="uploadForm">
                <div class="form-group">
                    <label for="recipeTitle">Recipe Title</label>
                    <input type="text" id="RecipeTitle" required placeholder="E.g., Miffy Sugar Cookies">
                </div>
                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                    <label for="recipePrepTime">Prep Time</label>
                <input type="text" id="recipePrepTime" required placeholder="E.g.,45 mins">   
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="recipePortions">Base Portions(Yield)</label>
                    <input type="number" id="recipePortions" required min="1" value="12">
                </div>

                    </div>
                    <div style="display: flex; gap: 1rem;">
                        <div class="form-group" style="flex: 1;">
                            <label for="recipeCategory">Category></label>
                            <select id="recipeCategory" required>
                                <option value="cookies">Cookies</option>
                                <option value="bread">Breads</option>
                                <option value="cakes">Cakes</option>
                                <option value="ice-cream">Ice Cream</option>
                                <option value="pastries">Pastries</option>
                                <option value="confections/candy">Confections/Candy</option>
                                <option value="other">Other</option>

                            </select> 
                        </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="recipeSeason">Season</label>
                        <select id="recipeSeason" required>
                            <option value="all">All Year</option>
                            <option value="spring">Spring</option>
                            <option value="summer">Summer</option>
                            <option value="fall">Fall</option>
                            <option value="winter">Winter</option>
                        </select>
                    </div>    
                    </div>
                    <div class="form-group">
                        <label for="recipeIngredients">Ingredients(Write quantities clearly, e.g.,"1.5 cups flour")></label>
                            <textarea id="recipeIngredients" required placeholder="1.5 cups flour, 2 eggs..." rows="3"></textarea>
                    
                    </div>
                    <div class="form-group"> 
                        <label for="recipeInstructions">Instructions</label>
                        <textarea id="recipeInstructions" required placeholder="1.Preheat oven...&#10;2.Mix..." rows="5"></textarea>
                    </div>
                    <button type="submit" class="btn-primary submit-btn">
                        <span class="btn-text">Post Recipe</span>
                        <div class="loader hidden"></div>
                    </button>
            </form>
        </div>
    </div>
    </body>
</html>
